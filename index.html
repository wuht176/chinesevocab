<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="color-scheme" content="light only"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chinese Vocabulary</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500..800;1,9..144,500&family=Be+Vietnam+Pro:wght@400;500;600&family=Lora:ital,wght@0,400..700;1,400..600&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet"><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{color-scheme:light only;--bg:#faf1e4;--cd:#fde8ef;--pk:#f6bfd1;--pk2:#c2417a;--tx:#5a2a3f;--mt:#a0707f;--hd:#b0306b;--ok:#d3efdf;--bad:#fbd0d0;--ln:#f0d2c4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

main,.w{max-width:820px;margin:auto;padding:12px}

.nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.nav button{padding:8px 18px}
input,textarea{font:inherit;border:1px solid var(--pk);border-radius:12px;padding:8px;background:#fff7fa;color:var(--tx)}input[type=number]{width:80px}textarea{width:100%;min-height:90px}
.big{font-size:2rem}.huge{font-size:4.5rem;text-align:center;padding:40px 0}.sm{font-size:.9rem;color:var(--mt);white-space:pre-line}.c{text-align:center;color:var(--mt)}
.py{display:none;font-style:normal;color:var(--pk2);font-size:.6em;margin-left:.3em}.py.on,.sh>.py{display:inline}.tg{cursor:pointer;color:var(--pk2);font-size:.55em;margin-left:.25em;padding:2px 4px;user-select:none}
.opt{border:2px solid var(--pk);border-radius:14px;padding:10px 14px;margin:8px 0;cursor:pointer;background:#fff7fa}.opt:hover{border-color:var(--pk)}.ok{background:var(--ok)!important}.bad{background:var(--bad)!important}.sel{border-color:var(--pk2)}

h1,h3,h4,.big,.huge,.timer{color:var(--hd);font-family:Fraunces,Lora,"Noto Serif SC","Songti SC","SimSun","Noto Sans SC","PingFang SC","Microsoft YaHei",Georgia,serif}.hz{color:var(--hd);font-family:Lora,"Noto Serif SC","Songti SC","SimSun","Noto Sans SC","PingFang SC","Microsoft YaHei",serif;letter-spacing:.04em}.huge{line-height:1.2}header h1{color:#8f1f55;font-size:2rem;font-weight:800;letter-spacing:.5px}header i{color:#8f1f55;font-family:Fraunces,Lora,"Noto Serif SC","Songti SC","SimSun","Noto Sans SC","PingFang SC","Microsoft YaHei",Georgia,serif}
</style><style id=ui2>
:root{--bg:#f9f0e3;--cd:#fffaf5;--ln:#ecd9c6;--hd:#a02458;--hzf:Lora,"Noto Serif SC","Songti SC","SimSun",serif}
body{font-size:16.5px}
header{position:sticky;top:0;z-index:20;background:rgba(249,240,227,.93);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln);padding:10px 16px;text-align:left;color:var(--hd)}
header .bar{max-width:820px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

</head><body>
<header><div class=bar><h1>Chinese Vocabulary</h1><div class=nav><button data-t=fc onclick="go('fc')">🃏 Flashcard</button><button data-t=ls onclick="go('ls')">📚 Danh sách</button><button data-t=qz onclick="go('qz')">📝 Quiz</button><button data-t=ap onclick="go('ap')">💬 Ứng dụng</button></div></div></header>
<main>
<details class=card id=flt></details>
<small id=sy class=c></small>
<div id=main></div>
<p class=c style="font-size:.8rem">Dữ liệu tự đồng bộ từ Google Sheet mỗi lần mở trang (hoặc bấm ↻). Tiến độ học lưu ngay trên trình duyệt này.</p>
</main>
<script>
let D=[];
let P={};try{P=JSON.parse(localStorage.getItem('zhP')||'{}')}catch(e){}
let T={};try{T=JSON.parse(localStorage.getItem('zhT')||'{}')}catch(e){}
const sv=()=>{try{localStorage.setItem('zhP',JSON.stringify(P));localStorage.setItem('zhT',JSON.stringify(T))}catch(e){}};
const APP_URL='https://script.google.com/macros/s/AKfycbzesHYR7bKn_qacFkEVT8F19chx8Sahp5Cz8Yh0rCTUF4PPtouVWPxGyptme7S-Fc8E1g/exec',APP_KEY='wuht';let QQ={},tq;const syS=t=>{const e=document.getElementById('sy');if(e)e.textContent=t};
function push(rows){rows.forEach(([a,b])=>QQ[a]=b);clearTimeout(tq);tq=setTimeout(flush,1200)}
async function flush(){const rows=Object.entries(QQ);QQ={};if(!rows.length)return;if(!APP_URL)return syS('☁ Tiến độ lưu trên máy này (chưa nối Sheet)');syS('⏳ Đang gửi tiến độ lên Sheet…');try{await fetch(APP_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:APP_KEY,rows:rows.map(([a,b])=>[+a,b])})});syS('☁ Đã gửi tiến độ lên Google Sheet')}catch(e){rows.forEach(([a,b])=>QQ[a]=b);syS('⚠ Gửi lỗi, sẽ thử lại lần sau')}}
const $=i=>document.getElementById(i),R=a=>a[Math.random()*a.length|0];
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hz=(w,c)=>`<span class="hz ${c||''}">${esc(w.han)}<b class=tg>▸</b><i class=py>${esc(w.py)}</i></span>`;
const zs=(s,c)=>`<span class="hz ${c||''}">${esc(s.zh)}<b class=tg>▸</b><i class=py>${esc(s.py)}</i></span>`;
const say=t=>{try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='zh-CN';u.rate=.85;speechSynthesis.speak(u)}catch(e){}};
const nm=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9\u4e00-\u9fff]/g,'');
document.addEventListener('click',e=>{const t=e.target;
 if(t.classList&&t.classList.contains('tg')){t.nextElementSibling.classList.toggle('on');e.stopPropagation();e.preventDefault();return}
 const b=t.closest&&t.closest('.chips>button');if(b){const p=b.parentNode;if(p.classList.contains('one')){[...p.children].forEach(x=>x.classList.remove('on'));b.classList.add('on')}else b.classList.toggle('on')}},true);
let MAX=1,F={a:1,b:1,L:[]};
const pool=()=>D.filter(w=>w.stt>=F.a&&w.stt<=F.b&&(!F.L.length||w.ls.some(l=>F.L.includes(l))));
function fltUI(){$('flt').innerHTML=`<summary><b>🎯 Chọn từ cần học</b> · <span id=cnt></span> <span class=sm>(bấm để mở bộ lọc)</span></summary><br>STT từ <input id=fa type=number value=${F.a} min=1 max=${MAX}> đến <input id=fb type=number value=${F.b} min=1 max=${MAX}>
<div class="chips" id=fl>${Array.from({length:15},(_,i)=>`<button data-k=${i+1} class="${F.L.includes(i+1)?'on':''}">Bài ${i+1}</button>`).join('')}</div>
<button class=go onclick="fApply()">Áp dụng</button> <button onclick="load()">↻ Đồng bộ lại từ Google Sheet</button> <span class=sm>Để trống bài = tất cả bài</span>`;$('cnt').textContent=pool().length+' từ'}
function fApply(){F.a=+$('fa').value||1;F.b=+$('fb').value||MAX;F.L=[...document.querySelectorAll('#fl .on')].map(b=>+b.dataset.k);$('cnt').textContent=pool().length+' từ';go(S.t)}
const bw=w=>{const p=P[w.stt]||0;return `<div class=pbw><div class=pb><i style="width:${p}%"></i></div><span>${p}%</span></div>`};
const det=(w,s,nb)=>`<div class=det><div class=big>${hz(w,s?'sh':'')} <button onclick="say('${w.han}')">🔊</button></div>${nb?'':bw(w)}<p><b>${esc(w.vi)}</b> · Hán Việt: ${esc(w.hv)} · <em>${esc(w.pos)}</em></p>
${w.rad?`<p class=sm><b>Bộ thủ:</b>\n${esc(w.rad)}</p>`:''}${w.ex.map(e=>`<p class=ex>${zs(e,s?'sh':'')}<br>${esc(e.vi)}</p>`).join('')}${w.note?`<p class=sm><b>Ghi chú:</b>\n${esc(w.note)}</p>`:''}
<p class=sm>Bài: ${w.ls.join(', ')} · STT ${w.stt} · <a target=_blank href="https://hanzii.net/search/word/${encodeURIComponent(w.han)}?hl=en">Tra Hanzii ↗</a></p></div>`;
const S={t:'fc',sub:'cz'};let tm;
function go(t){S.t=t;clearInterval(tm);document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.t==t));({fc:()=>fcStart(0),ls:listView,qz:quizSetup,ap:()=>apGo(S.sub)})[t]()}
// ---------- Danh sách
function listView(){$('main').innerHTML=`<div class=card><input id=q placeholder="🔍 Tìm chữ Hán, pinyin hoặc nghĩa…" oninput="listDraw()"><p class=sm id=lc></p></div><div id=lst></div>`;listDraw()}
function listDraw(){const q=nm($('q').value||''),a=pool().filter(w=>!q||nm(w.han+w.py+w.vi+w.hv).includes(q));
 $('lc').textContent=a.length+' từ · tiến độ trung bình '+(a.length?Math.round(a.reduce((x,w)=>x+(P[w.stt]||0),0)/a.length):0)+'% · bấm vào từ để xem chi tiết';
 $('lst').innerHTML=a.map(w=>`<details class="card wr" ontoggle="if(this.open&&!this.dataset.l){this.dataset.l=1;this.insertAdjacentHTML('beforeend',det(D.find(x=>x.stt==${w.stt}),1,1))}"><summary><div class=hzc><span class=hz>${esc(w.han)}</span><i class=pyv>${esc(w.py)}</i></div><div class=mn><b>${esc(w.vi)}</b><span class=sm> · ${esc(w.hv)}</span>${bw(w)}</div></summary></details>`).join('')}
// ---------- Flashcard
let fc={};
function fcStart(s){const d=pool().filter(w=>(P[w.stt]||0)<100);fc={deck:s?sh(d):d,i:0,f:0,s};fcDraw()}
function fcDraw(){const d=fc.deck;let h=`<div class=acts><button class="${fc.s?'':'on'}" onclick="fcStart(0)">Theo thứ tự</button><button class="${fc.s?'on':''}" onclick="fcStart(1)">Xáo trộn</button><button onclick="if(confirm('Đặt lại tiến độ tất cả từ về 0%?')){D.forEach(w=>{P[w.stt]=0;T[w.stt]=Date.now()});sv();push(D.map(w=>[w.stt,0]));fcStart(fc.s)}">Đặt lại tiến độ</button></div>`;
 if(!d.length){$('main').innerHTML=h+'<div class=card>🎉 Không còn từ nào cần học trong bộ lọc này.</div>';return}
 const w=d[fc.i],p=P[w.stt]||0;
 $('main').innerHTML=h+`<p class=c>Thẻ ${fc.i+1}/${d.length} · còn ${d.length} từ chưa thuộc</p><div class=fcard onclick="if(!event.target.closest('a,button,.tg')){fc.f^=1;fcDraw()}">${fc.f?det(w,1):`<div class=huge>${esc(w.han)}</div><p class=c>Chạm để lật thẻ</p>`}</div>
 <div class=pb><i style="width:${p}%"></i></div><p class=c>Tiến độ từ này: ${p}%</p>
 <div class=acts><button class=no onclick="fcAct(0)">Chưa thuộc (0%)</button><button class=mid onclick="fcAct(1)">Gần thuộc (+10%)</button><button class=yes onclick="fcAct(2)">Đã thuộc (100%)</button></div>`}
function fcAct(k){const d=fc.deck,w=d[fc.i];let p=P[w.stt]||0;
 if(k==2)p=100;else if(k==1)p=Math.min(100,p+10);else p=0;P[w.stt]=p;T[w.stt]=Date.now();sv();push([[w.stt,p]]);
 if(p>=100)d.splice(fc.i,1);else d.push(d.splice(fc.i,1)[0]);
 if(fc.i>=d.length)fc.i=0;fc.f=0;fcDraw()}
// ---------- Quiz
const QM={hv:['Hán tự → Nghĩa','vi'],vh:['Nghĩa → Hán tự','han'],hp:['Hán tự → Pinyin','py'],ph:['Pinyin → Hán tự','han'],lh:['Nghe → đoán Hán tự','han']};let Q={};
const chipsOne=(id,arr)=>`<div class="chips one" id=${id}>${arr.map((x,i)=>`<button data-k="${x[0]}" class="${i?'':'on'}">${x[1]}</button>`).join('')}</div>`;
const sel=id=>document.querySelector('#'+id+' .on').dataset.k;
function quizSetup(){$('main').innerHTML=`<div class=card><h3>Chế độ</h3>${chipsOne('qm',Object.entries(QM).map(([k,v])=>[k,v[0]]))}<h3>Dạng câu hỏi</h3>${chipsOne('qt',[['mc','Trắc nghiệm'],['ty','Điền từ']])}<h3>Số câu</h3>${chipsOne('qn',[[10,10],[20,20],[30,30]])}<p><button class=go onclick="quizStart()">Bắt đầu</button></p></div>`}
function dist(w,f){const seen=new Set([w[f]]),o=[];for(const x of sh(D).sort((a,b)=>(b.pos==w.pos)-(a.pos==w.pos)))if(!seen.has(x[f])){seen.add(x[f]);o.push(x);if(o.length==3)break}return o}
function quizStart(){const p=pool();if(p.length<1)return $('main').innerHTML='<div class=card>Bộ lọc đang trống.</div>';
 const m=sel('qm');Q={m,f:QM[m][1],t:sel('qt'),list:sh(p).slice(0,+sel('qn')),i:0,s:0,wrong:[]};quizAsk()}
function quizAsk(){const w=Q.list[Q.i];if(!w)return quizEnd();Q.w=w;Q.d=dist(w,Q.f);Q.done=0;const m=Q.m;
 const pr=m=='hv'||m=='hp'?`<div class=big>${hz(w)}</div>`:m=='vh'?`<div class=big>${esc(w.vi)}</div>`:m=='ph'?`<div class=big>${esc(w.py)}</div>`:`<button class=go onclick="say(Q.w.han)">🔊 Nghe</button>`;
 const op=x=>Q.f=='han'?hz(x):esc(x[Q.f]);
 const body=Q.t=='mc'?sh([w,...Q.d]).map(x=>`<div class=opt data-id=${x.stt} onclick="qPick(${x.stt})">${op(x)}</div>`).join(''):`<p><input id=qi placeholder="Nhập đáp án…" onkeydown="if(event.key=='Enter')qTy()"> <button class=go onclick="qTy()">Kiểm tra</button></p><p class=sm>${Q.f=='py'?'Pinyin: không cần dấu thanh cũng được. ':Q.f=='vi'?'Nghĩa: gõ có hoặc không dấu đều được. ':''}</p>`;
 $('main').innerHTML=`<p class=c>Câu ${Q.i+1}/${Q.list.length} · Đúng ${Q.s}</p><div class=card>${pr}${body}</div><div id=ex></div>`;if(m=='lh')say(w.han)}
const chk=(w,v)=>Q.f=='han'?v.trim()==w.han:Q.f=='py'?nm(v)==nm(w.py):(nm(v)&&[w.vi,...w.vi.split(/[;,\/]/)].some(x=>nm(x)==nm(v)));
function qTy(){if(Q.done)return;const v=$('qi').value;if(!v.trim())return;qFin(chk(Q.w,v),0)}
function qPick(id){if(Q.done)return;qFin(id==Q.w.stt,id)}
const why=(x,w)=>`${x.han} (${x.py}) nghĩa là “${x.vi}” [${x.pos}], khác với ${w.han} (${w.py}) nghĩa là “${w.vi}”${x.pos!=w.pos?`; ngoài ra khác từ loại (${x.pos} ≠ ${w.pos})`:''}.`;
function qFin(ok,pick){Q.done=1;const w=Q.w;if(ok)Q.s++;else Q.wrong.push(w);
 document.querySelectorAll('.opt').forEach(o=>{if(o.dataset.id==w.stt)o.classList.add('ok');else if(o.dataset.id==pick)o.classList.add('bad')});
 $('ex').innerHTML=`<div class="card ${ok?'ok':'bad'}"><b>${ok?'✅ Chính xác!':'❌ Chưa đúng'}</b> Đáp án: <b>${Q.f=='han'?esc(w.han):esc(w[Q.f])}</b></div><h4>Giải thích từ vựng</h4>${det(w,1)}<h4>${Q.t=='mc'?'Các đáp án nhiễu':'Các từ dễ nhầm'}</h4><div class=card><ul>${Q.d.map(x=>`<li>${hz(x,'sh')}: ${esc(why(x,w))}</li>`).join('')}</ul></div><p class=acts><button class=go onclick="Q.i++;quizAsk()">Câu tiếp ›</button></p>`;
 $('ex').scrollIntoView({behavior:'smooth'})}
function quizEnd(){$('main').innerHTML=`<div class=card><h3>Hoàn thành! ${Q.s}/${Q.list.length}</h3>${Q.wrong.length?'<p>Từ cần ôn lại:</p><ul>'+Q.wrong.map(w=>`<li>${hz(w,'sh')} — ${esc(w.vi)}</li>`).join('')+'</ul>':'<p>Tuyệt vời, không sai câu nào 🌸</p>'}<button class=go onclick="quizSetup()">Làm lại</button></div>`}
// ---------- Ứng dụng thực tế
const SUB={cz:['Điền từ',czNew],dr:['Bốc thăm đặt câu',drNew],st:['Story Chain',stNew],mt:['Nối từ',mtSetup]};
function apGo(s){S.sub=s;clearInterval(tm);$('main').innerHTML=`<div class=acts>${Object.entries(SUB).map(([k,v])=>`<button class="${k==s?'on':''}" onclick="apGo('${k}')">${v[0]}</button>`).join('')}</div><div id=sub></div>`;SUB[s][1]()}
let C={};
function czNew(){const it=[];for(const w of pool())for(const e of w.ex)if(e.zh.includes(w.han))it.push([w,e]);
